name: Bug 报告
description: 报告可复现的缺陷、文档错误或机制偏差
title: "[Bug] "
body:
  - type: checkboxes
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 Issues 和 PR，没有发现相同问题。
          required: true
        - label: 我已移除凭据、真实项目数据、服务器和其他敏感信息。
          required: true
  - type: input
    attributes:
      label: 使用版本
      description: 请填写公开版本号或提交标识。
      placeholder: 例如 v0.1.0
    validations:
      required: true
  - type: textarea
    attributes:
      label: 问题描述
      description: 说明实际发生了什么，以及为什么这是一个问题。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 最小复现步骤
      description: 提供可以从干净状态复现问题的步骤，请勿包含敏感信息。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: 期望结果
      description: 说明正确行为应该是什么。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 实际结果与证据
      description: 提供已脱敏的错误、日志、截图或测试结果。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 运行环境
      description: 操作系统、Codex 形态、Node.js 版本及其他相关信息。
  - type: textarea
    attributes:
      label: 补充信息
      description: 已尝试的规避方式、影响范围或其他上下文。
