name: 功能建议
description: 建议新的通用能力、流程改进或架构调整
title: "[Feature] "
body:
  - type: checkboxes
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 Issues 和 PR，没有发现相同建议。
          required: true
        - label: 这个建议面向通用模板，不依赖单一私有项目事实。
          required: true
  - type: textarea
    attributes:
      label: 要解决的问题
      description: 描述当前痛点、使用场景和可观察影响。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 目标结果
      description: 说明改进后应该得到什么结果，不要只描述实现手段。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 建议方案
      description: 说明方案、边界、可能涉及的文档或 Skills。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 不做什么
      description: 明确范围外内容和不希望引入的行为。
  - type: textarea
    attributes:
      label: 验收方式
      description: 说明怎样判断建议已经被正确实现且没有明显回退。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 风险与兼容性
      description: 说明对控制权、授权、安全、现有文档或旧项目的潜在影响。
