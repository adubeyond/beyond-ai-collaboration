name: public-validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate_matrix:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate public repository content
        run: node scripts/check-public-content.mjs --strict-candidate
      - name: Validate project identity
        run: node --test scripts/check-m3-project-identity.mjs
      - name: Validate project execution routing
        run: node --test scripts/check-project-runtime-routing.mjs
      - name: Validate terminal receipts
        run: node --test scripts/check-worker-result-receipts.mjs
      - name: Validate existing-project adoption
        run: node scripts/check-existing-project-adoption.mjs
      - name: Validate install integrity
        run: node scripts/check-install-integrity.mjs
      - name: Validate project-entry migration
        run: node scripts/check-project-entry-migration.mjs
      - name: Validate workbench upgrade migration
        run: node --test scripts/check-workbench-upgrade-migration.mjs
      - name: Validate implementation paths
        run: node scripts/check-implementation-paths.mjs
      - name: Run minimal example tests
        working-directory: examples/minimal-project
        run: npm test
      - name: Run minimal example syntax check
        working-directory: examples/minimal-project
        run: npm run check

  validate:
    name: validate
    if: ${{ always() }}
    needs: validate_matrix
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all platform checks passed
        run: test "${{ needs.validate_matrix.result }}" = "success"
