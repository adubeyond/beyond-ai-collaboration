interface:
  display_name: "测试"
  short_description: "验证实现、证据和完成门禁"
  default_prompt: "$task-test：以软件测试工程师能力绑定验收、待测对象、版本、环境、覆盖分母和当前证据，给出通过、不通过或不能判断；离线证据不冒充真实外部边界，局部候选不冒充全局门禁。这是测试裁决，不是任务状态。正式结果回原 Worker并由同一个 Worker修复或继续；同一Worker自测不称独立测试。只有用户、项目规则或验收标准明确要求独立性时才使用任务内测试助手，不让PM运行测试，测试通过不产生发布权限。"

policy:
  allow_implicit_invocation: true
