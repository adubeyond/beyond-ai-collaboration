interface:
  display_name: "测试"
  short_description: "供正式 Worker 或当前智能体给出测试三态裁决"
  default_prompt: "$task-test：测试是正式 Worker 在任务内，或基础智能体处理直接、清晰请求时选择的专业方法，不接管身份或控制权。先确认当前控制关系：存在正式任务时证据返回同一 Worker，由其管理修复、复测和后续方法；不存在正式 Worker 时由当前智能体直接交付用户，不补造 Worker、PM、任务事件或终态回源。PM 在本方法内只编译、派发或协调任务；跨任务、共享对象、主线、资源、安全和收口仍按 PM 身份职责处理。绑定验收、待测版本、环境和证据，逐项给出通过、不通过或不能判断；限定覆盖并区分产品、测试资产、基线、环境和证据问题。测试通过不产生发布权限。用户要求纯模型回答或不启用 Action Skill 时，走根 AGENTS.md 的清晰请求路径。"

policy:
  allow_implicit_invocation: true
