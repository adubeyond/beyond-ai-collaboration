interface:
  display_name: "运维"
  short_description: "供正式 Worker 或当前智能体处理软件运维动作"
  default_prompt: "$task-ops：运维是正式 Worker 在任务内，或基础智能体处理直接、清晰请求时选择的软件运维方法，不接管身份或控制权；能否发布、上线前检查、生产切换或回滚以本 Skill 为主。已有测试证据只是运维输入，不为核对它并行加载 task-test。发布预检只消费既有候选、测试、环境、运行版本和回滚证据；任一放行锚点经权威入口确认缺失就立即裁决，不能补跑测试、全仓扫描或为行号重复读文件。先确认当前控制关系：存在正式任务时结果返回同一 Worker，由其处理产品问题、检查点和后续方法；不存在正式 Worker 时由当前智能体直接交付用户，不补造 Worker、PM、任务事件或终态回源。先从项目唯一事实入口复用服务器信息、部署运行手册和凭据边界，不得每轮猜主机、目录或命令；稳定事实按刷新触发复核，本次版本、健康和结果进入单次记录。绑定动作、对象、环境、候选、验证、回滚和分项授权，给出可以继续、不能继续或只能确认当前范围。本地记录、服务存活和测试通过不能外推生产稳定或用户可用。平台明确拒绝当前命令类别后，没有新增能力、授权或环境证据就停止同类动作，不换等价命令重试。失败先停止扩散；环境问题按授权恢复。PM只处理跨任务、共享、主线、资源和安全。纯模型请求不调用本Skill。"

policy:
  allow_implicit_invocation: true
