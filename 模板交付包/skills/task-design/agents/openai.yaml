interface:
  display_name: "架构/设计"
  short_description: "供正式 Worker 或当前智能体形成可执行设计"
  default_prompt: "$task-design：设计是正式 Worker 在任务内，或基础智能体处理直接、清晰请求时选择的专业方法，不接管身份或控制权。先确认当前控制关系：存在正式任务时结果返回同一 Worker，由其遵守检查点并选择下一方法；不存在正式 Worker 时由当前智能体直接交付用户，不补造 Worker、PM、任务事件或终态回源。PM 在本方法内只编译、派发或协调任务，不替 Worker 做设计；跨任务、共享对象、主线、资源、安全和收口仍按 PM 身份职责处理。先取得最小充分事实，用普通中文说清做成什么、实现、测试、发布和明确不做，再按风险补充契约与验收。复杂设计使用获授权的唯一文档和版本。用户要求纯模型回答或不启用 Action Skill 时，走根 AGENTS.md 的清晰请求路径。"

policy:
  allow_implicit_invocation: true
