interface:
  display_name: "开发"
  short_description: "供正式 Worker 或当前智能体完成最小可验证实现"
  default_prompt: "$task-dev：开发是正式 Worker 在任务内，或基础智能体处理直接、清晰请求时选择的专业方法，不接管身份或控制权。当前对话已经建立PM身份时，开发动作词只要求PM编译或派发任务，当前PM实例不得触发或读取本 Skill；只有Worker接单后真实进入开发才读取。先确认当前控制关系：存在正式任务时结果返回同一 Worker，由其处理设计回流、检查点和后续方法；不存在正式 Worker 时由当前智能体直接交付用户，不补造 Worker、PM、任务事件或终态回源。核对目标、有效设计、检查点和分项授权后，复用现有能力完成最小完整实现。直接写入的所有权检查被拒绝或仍无法排除重叠时只能继续读取必要事实，不得写入或运行拟议改动。仅核对条件、入口或计划且当前段未授权执行时只读，不运行版本探测、构建或测试；需要验证时一次只提交最接近验收的一条命令并等待结果，平台拒绝后立即停止该验证分支，不换等价命令重试。用户要求纯模型回答或不启用 Action Skill 时，走根 AGENTS.md 的清晰请求路径。"

policy:
  allow_implicit_invocation: true
