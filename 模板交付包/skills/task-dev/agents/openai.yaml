interface:
  display_name: "开发"
  short_description: "供正式 Worker 或当前智能体完成最小可验证实现"
  default_prompt: "$task-dev：开发是正式 Worker 在任务内，或基础智能体处理直接、清晰请求时选择的专业方法，不接管身份或控制权。先确认当前控制关系：存在正式任务时结果返回同一 Worker，由其处理设计回流、检查点和后续方法；不存在正式 Worker 时由当前智能体直接交付用户，不补造 Worker、PM、任务事件或终态回源。PM 在本方法内只编译、派发或协调任务，不替 Worker 实现；跨任务、共享对象、主线、资源、安全和收口仍按 PM 身份职责处理。核对目标、有效设计、检查点和分项授权后，复用现有能力完成最小完整实现，守住工程底线并取得未被削弱的自测证据。用户要求纯模型回答或不启用 Action Skill 时，走根 AGENTS.md 的清晰请求路径。"

policy:
  allow_implicit_invocation: true
